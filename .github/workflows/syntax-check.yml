name: syntax-check
on:
  push:
    branches: [fix/safe-enhancements-2026-09-10]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile bot.py core.py rubika_v2.py server.py sitecustomize.py enhancements.py
